# ==========================================================================
# 24. ESSENTIAL METHODOLOGICAL NOTES
# ==========================================================================
essential_methodological_notes:
  - "The study uses information-matched comparison: only the integration pathway of regime variables is varied while all other components are held fixed."
  - "The same two regime variables are used in every experiment; only their point of entry into the network changes."
  - "MLP-L with H=44 is approximately capacity-matched to RG-ResMoE (frozen base H=16 plus four experts H=16)."
  - "The base network in RG-ResMoE is trained first and then frozen."
  - "Each residual expert in RG-ResMoE uses a zero-initialized final layer, so at initialization the model exactly reproduces the frozen base forecast."
  - "The gate in RG-ResMoE receives (x,z); the base and experts receive only x."
  - "Soft routing consistently outperforms all hard-routing variants."
  - "Input concatenation of the same regime variables degrades IC and training stability relative to gate-based integration."
  - "All neural models use full-batch Adam optimization with early stopping and checkpoint restoration."
  - "Hyperparameters are selected by validation IC with three filters: interior-of-grid, IC dominance over runner-up by more than one seed-standard-deviation, and MSE within one standard deviation of the sweep minimum."
  - "All final results are reported as mean ± standard deviation over 30 random seeds."
  - "Statistical significance is assessed using paired seed-averaged Diebold-Mariano style tests with Newey-West standard errors with four lags."
  - "The collapse threshold is a prespecified diagnostic: mean test QLIKE greater than 2.0."
  - "No LLM, prompt template, or generative AI component is used in the study."
  - "Every parameter marked UNSPECIFIED IN MANUSCRIPT must be resolved through the decision log before full 30-seed runs begin."
